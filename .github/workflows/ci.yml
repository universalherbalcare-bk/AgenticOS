name: AgenticOS CI

# One CI system for one OS. Before the merge there were two (Agno's 7 workflows,
# OpenClaw's 101). This is the merged gate: it blocks on red for BOTH planes and
# on the contract that joins them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 3.14: the one Python of the merged product (the APEX OS kernel ships on the 3.14 framework
  # build). Brain unit suite on 3.14.5 with the install list below, 2026-09-12: 232 failed /
  # 12,616 passed / 509 skipped / 312 errors, identical to the pristine 3.13 baseline, 0 regressions.
  # Bridge e2e 30/30 and cross-plane 6/6 on 3.14 from a clean checkout.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"

jobs:
  merge-integrity:
    name: Merge integrity (deletion ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install brain plane
        # The same dependency set the brain job installs. With only the bare package,
        # scripts_audit_dangling_refs.py reports 81/193 packages importable; with this
        # set it reports the 149/193 the Phase 0 baseline records. The gate's invariant
        # (zero dangling imports, more than zero packages importable) holds either way,
        # but the number this job prints should be the one the baseline cites.
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/brain-constraints.txt -e planes/brain/libs/agno
          # Same list as the brain job (plus its four extras) so the number this job prints is
          # the number the baseline records; the gate's own invariant does not depend on it.
          # pytest is pinned below 9.1: pytest 9.1.1's assertion rewriter makes inspect.getsource raise
          # "could not get source code" on Python 3.14, which fails 25 baselined-green tests
          # (tests/unit/environments, tests/unit/scorer digest tests); the same tests pass on 9.0.3
          # and under --assert=plain. Measured 2026-09-13.
          pip install -c tests/brain-constraints.txt "pytest<9.1" pytest-asyncio pytest-mock sqlalchemy requests numpy anthropic openai fastapi uvicorn timeout-decorator PyJWT python-multipart websockets httpx
      - name: Deletion ledger matches the tree
        run: python scripts/check-deletion-ledger.py
      # Runs on the job interpreter, which installed the brain plane above. The
      # script REFUSES (exit 2) on an interpreter that cannot import agno, because
      # it would otherwise report success having imported nothing.
      - name: Every deleted module has zero inbound refs, every survivor imports
        run: python scripts_audit_dangling_refs.py

  bridge:
    name: Bridge contract + cross-plane E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/brain-constraints.txt -e planes/brain/libs/agno
          # sqlalchemy: agno.db.sqlite.SqliteDb (the brain's real persistence) is built on it.
          # anthropic: lets the factory test exercise "resolves without a key" on CI too.
          pip install -c tests/brain-constraints.txt fastapi uvicorn python-multipart PyJWT websockets openai anthropic pyyaml sqlalchemy "pytest<9.1" pytest-asyncio httpx
      - name: Contract parity + bridge suites
        env:
          PYTHONPATH: bridge/py:planes/brain
        run: python -m pytest tests/e2e -q --asyncio-mode=auto
      # Brain-plane wiring: config loader (fail-closed ${VAR}), executor factory with a
      # REAL db (REQ-0041), ONE app (control plane + bridge), persistence + trace
      # metadata in the db, and idempotency proven across OS processes.
      - name: Brain wiring suite
        env:
          PYTHONPATH: bridge/py:planes/brain:tests/brain
          AGENTICOS_VERIFY_DB: ${{ runner.temp }}/agenticos-verify.db
        run: python -m pytest tests/brain -q --asyncio-mode=auto
      # The cross-plane test now runs against the REAL config-driven brain
      # (python -m agenticos_brain), not the tests/e2e fixture. Same executors the
      # operator would get from agenticos.config.yaml's shape, isolated db.
      - name: Cross-plane end-to-end (TS edge -> real Python brain)
        env:
          PYTHONPATH: bridge/py:planes/brain
          AGENTICOS_CONFIG: tests/brain/verify.config.yaml
          AGENTICOS_VERIFY_DB: ${{ runner.temp }}/agenticos-xplane.db
          AGENTICOS_BRAIN_PORT: "8919"
          BRAIN_URL: http://127.0.0.1:8919
        run: |
          python -m agenticos_brain &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8919/v1/bridge/health && break
            sleep 0.5
          done
          node --test tests/e2e/cross_plane.test.ts

  brain:
    name: Brain plane (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/brain-constraints.txt -e planes/brain/libs/agno
          # PyJWT, python-multipart, websockets and httpx are part of this list because the
          # 277/312 baselines were recorded with them present. Without them the same suite on the
          # same interpreter reports 391 failed / 480 errors (159 + 164 "regressions", all
          # ModuleNotFoundError: jwt / "python-multipart" missing): measured 2026-09-12 on 3.13 and
          # 3.14 alike. A job whose install list cannot reproduce its own baseline reds every run.
          # pytest is pinned below 9.1: pytest 9.1.1's assertion rewriter makes inspect.getsource raise
          # "could not get source code" on Python 3.14, which fails 25 baselined-green tests
          # (tests/unit/environments, tests/unit/scorer digest tests); the same tests pass on 9.0.3
          # and under --assert=plain. Measured 2026-09-13.
          pip install -c tests/brain-constraints.txt "pytest<9.1" pytest-asyncio pytest-mock sqlalchemy requests numpy anthropic openai fastapi uvicorn timeout-decorator PyJWT python-multipart websockets httpx
      # The brain plane inherits ~277 upstream failures that need API keys or
      # uninstalled vendor SDKs, so "pytest exits 0" can never be green and would
      # train everyone to ignore this job. Gate on NEW failures instead.
      - name: Unit tests (regression-gated against the pristine baseline)
        working-directory: planes/brain/libs/agno
        run: |
          set +e
          python -m pytest tests/unit \
            --asyncio-mode=auto --continue-on-collection-errors --tb=no -q -rfE \
            > /tmp/pytest-merged.txt 2>&1
          set -e
          tail -1 /tmp/pytest-merged.txt
      - name: Assert zero regressions vs pristine baseline
        run: python scripts/check-no-regressions.py /tmp/pytest-merged.txt

  edge:
    name: Edge plane (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # Node 25 stopped distributing Corepack (nodejs/node#57617, removed from release tarballs in
      # #59835), so on a setup-node 26 runner `corepack enable` finds no corepack. Install the pinned
      # version first; 0.35.0 resolved the packageManager pin pnpm@12.3.4 and completed a
      # --frozen-lockfile install from scratch under Node 26.8.1 on 2026-09-12.
      - run: npm install -g corepack@0.35.0 && corepack enable
      - name: Install
        working-directory: planes/edge
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: CLI smoke
        working-directory: planes/edge
        run: node openclaw.mjs --version
      - name: Bridge contract types (parity + strict typecheck)
        run: |
          node --test bridge/ts/src/contract.parity.test.ts
          planes/edge/node_modules/.bin/tsc -p bridge/ts/tsconfig.json
      - name: Tests for merge-touched areas
        working-directory: planes/edge
        run: corepack pnpm exec vitest run src/transcripts src/system-agent src/config/config.plugin-validation.test.ts
      # The first runtime path from the edge plane to the brain plane.
      - name: Edge->brain extension
        working-directory: planes/edge
        run: corepack pnpm exec vitest run extensions/agenticos-brain --reporter=dot
      - name: Kernel risk table (brain tools classified)
        working-directory: planes/edge
        run: corepack pnpm exec vitest run src/agents/agent-tools.kernel-authority-risk.test.ts --reporter=dot
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install brain for the cross-plane gates
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/brain-constraints.txt -e planes/brain/libs/agno
          pip install -c tests/brain-constraints.txt fastapi uvicorn python-multipart PyJWT websockets openai pyyaml sqlalchemy httpx
      - name: Build edge (the gateway and `agent --local` need dist/)
        working-directory: planes/edge
        run: corepack pnpm build
      # No APEX-OS checkout on CI, so these run with governance=native and say so;
      # the governed variants run on every developer machine via `agenticos verify`.
      - name: Gateway -> plugin -> brain -> database
        env: { AGENTICOS_PYTHON: python }
        run: bash scripts/e2e-gateway-brain.sh
      - name: LLM-initiated loop on the deterministic stub model
        env: { AGENTICOS_PYTHON: python }
        run: bash scripts/e2e-agent-loop-brain.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Direct invocation, same as the local pre-commit gate and the pre-push review.
      # gitleaks-action@v2 derives a commit range from the push event; on the very
      # first push that range starts at <root>^ (which does not exist), git errors,
      # and the action reports "scanned ~0 bytes" then fails - a scan that scans
      # nothing. Scanning the full history explicitly is deterministic and honours
      # the reviewed fingerprints in .gitleaksignore.
      - name: Install gitleaks
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Full-history secret scan
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .
